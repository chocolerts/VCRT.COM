<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        /* NAVIGATION BAR */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* SIGN IN CONTAINER */
        .main-container {
            max-width: 420px;
            margin: 80px auto;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
        }

        .form-title h2 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        .form-subtext {
            color: #666;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: var(--neon-outline);
            transform: translateY(-2px);
        }

        .status-message {
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
        }

        .status-success { color: #00ffaa; }
        .status-error { color: #ff3b30; }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Dashboard</a>
            <a href="transaction.html" class="dash-link">Transactions</a>
            <a href="signin.html" class="dash-link active" id="authLink">Sign In</a>
        </nav>
    </header>

    <main class="main-container" id="authContainer">
        <div class="form-title">
            <h2>MEMBER <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">LOGIN</span></h2>
            <div class="form-subtext">// Access Team Telemetry & Finances</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / ID</label>
                <input type="text" id="username" placeholder="Enter your ID" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div id="statusMessage" class="status-message"></div>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const authLink = document.getElementById("authLink");
        const loginForm = document.getElementById("loginForm");
        const statusMsg = document.getElementById("statusMessage");
        const authContainer = document.getElementById("authContainer");

        // CHECK IF ALREADY LOGGED IN
        const isLoggedIn = localStorage.getItem("vcrt_is_logged_in") === "true";
        const currentUser = localStorage.getItem("vcrt_user") || "Team Member";

        if (isLoggedIn) {
            // Update Navigation state
            authLink.innerText = "Sign Out";
            authLink.style.color = "#ff3b30";
            
            // Show Logged-in view instead of login form
            authContainer.innerHTML = `
                <div class="form-title">
                    <h2>ACTIVE <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">SESSION</span></h2>
                    <div class="form-subtext">// Logged in as ${currentUser}</div>
                </div>
                <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 25px;">You have full administrative access to log transactions and monitor vehicle metrics.</p>
                <button class="btn-submit" id="btnSignOut" style="background: #ff3b30; color: #fff;">Sign Out</button>
            `;

            document.getElementById("btnSignOut").addEventListener("click", performSignOut);
        }

        // HANDLE LOGIN SUBMISSION
        loginForm?.addEventListener("submit", function (e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();

            if (username !== "") {
                localStorage.setItem("vcrt_is_logged_in", "true");
                localStorage.setItem("vcrt_user", username);

                statusMsg.innerText = "AUTHENTICATED. REDIRECTING...";
                statusMsg.className = "status-message status-success";
                statusMsg.style.display = "block";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            }
        });

        // SIGN OUT FUNCTION
        function performSignOut() {
            localStorage.removeItem("vcrt_is_logged_in");
            localStorage.removeItem("vcrt_user");
            window.location.reload();
        }

        // HEADER SIGN OUT EVENT HANDLER
        authLink.addEventListener("click", function (e) {
            if (localStorage.getItem("vcrt_is_logged_in") === "true") {
                e.preventDefault();
                performSignOut();
            }
        });
    });
</script>

</body>
</html>
