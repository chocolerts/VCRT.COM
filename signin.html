<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Core Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 110px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / DASHBOARD MENU */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-row { display: flex; gap: 25px; }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .dash-link:hover, .active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* CONTAINER CONTENT */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background: #0a0a0a;
            padding: 50px;
            border-radius: 20px;
            border: 1px solid #222;
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: 0.4s;
        }

        .login-container:hover {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-outline);
        }

        .brand-title {
            font-weight: 900;
            letter-spacing: 8px;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: var(--neon-outline);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--neon-blue);
            background: #151515;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #444;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <div class="dash-menu">
            <div class="menu-row">
                <a href="vehicle.html" class="dash-link">2026</a>
                <a href="index.html" class="dash-link">Dashboard</a>
                <a href="#" class="dash-link">Team</a>
                <a href="#" class="dash-link">Partners</a>
                <a href="#" class="dash-link">Achievements</a>
            </div>
            <div class="menu-row" style="border-top: 1px solid #222; padding-top: 8px;">
                <a href="#" class="dash-link">History</a>
                <a href="transaction.html" class="dash-link">Transactions</a>
                <a href="signin.html" class="dash-link active">Sign In</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="login-container">
            <div class="brand-title">VCRT</div>
            <p style="color: #444; font-size: 0.7rem; margin-bottom: 30px; letter-spacing: 2px;">ACCESS RESTRICTED // CORE_AUTH</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>System Identifier</label>
                    <input type="text" id="usernameInput" placeholder="Username" required>
                </div>
                
                <div class="input-group">
                    <label>Access Protocol</label>
                    <input type="password" id="passwordInput" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-login">Initialize Session</button>
            </form>

            <a href="index.html" class="back-link">← RETURN TO MAIN INTERFACE</a>
        </div>
    </div>

    <script>
        // TETAPKAN USERNAME & PASSWORD DI SINI:
        const VALID_USERNAME = "admin";
        const VALID_PASSWORD = "password123";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const usernameEntered = document.getElementById('usernameInput').value;
            const passwordEntered = document.getElementById('passwordInput').value;

            if (usernameEntered === VALID_USERNAME && passwordEntered === VALID_PASSWORD) {
                localStorage.setItem('isLoggedIn', 'true');
                alert('Authentication Successful! Accessing Core Transaction Ledger.');
                window.location.href = "transaction.html"; 
            } else {
                alert('ACCESS DENIED: Username atau Password salah!');
            }
        });
    </script>

</body>
</html>
