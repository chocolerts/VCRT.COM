<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            text-align: center;
        }

        .login-card h2 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0 0 10px 0;
        }

        .login-card p {
            color: #888;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-outline);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: var(--neon-outline);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>VCRT <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">AUTH</span></h2>
        <p>// Authenticate Member Session</p>

        <form id="signinForm">
            <div class="form-group">
                <label>User ID</label>
                <input type="text" id="username" required placeholder="operator">
            </div>
            <div class="form-group">
                <label>Access Key</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Authorize</button>
        </form>

        <a href="index.html" class="back-link">← Return to Dashboard</a>
    </div>

<script>
    document.getElementById("signinForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const user = document.getElementById("username").value;
        if(user) {
            localStorage.setItem("vcrt_is_logged_in", "true");
            localStorage.setItem("vcrt_user", user);
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
