<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Dashboard Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Chart.js for Telemetry Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        .auth-container-right {
            display: flex;
            align-items: center;
            min-width: 80px;
            justify-content: flex-end;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
        }

        .hero-title p {
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* TELEMETRY GRAPH CONTAINER */
        .chart-section {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--neon-blue);
        }

        .chart-wrapper {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* DIVISION NAVIGATION CARDS */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .class-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .class-card:hover {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-outline);
            transform: translateY(-5px);
        }

        .class-card h2 {
            font-size: 2rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--neon-blue);
        }

        .class-card p {
            color: #888;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin: 0;
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <a href="index.html" class="brand-name">VCRT</a>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link active">Home</a>
            <a href="transaction.html" class="dash-link">Transactions</a>
            <a href="aboutus.html" class="dash-link">About Us</a>
        </nav>

        <div class="auth-container-right">
            <a href="signin.html" class="dash-link" id="authLink">Sign In</a>
        </div>
    </header>

    <main class="main-container">
        <div class="hero-title">
            <h1>TELEMETRY <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">METRICS</span></h1>
            <p>// Real-time performance analysis across active divisions</p>
        </div>

        <!-- GRAPH CONTAINER -->
        <div class="chart-section">
            <div class="chart-header">
                <span class="chart-title">Division Expenditure & Budgeting ($)</span>
            </div>
            <div class="chart-wrapper">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <!-- DIVISION CARDS -->
        <div class="class-grid">
            <a href="135cc.html" class="class-card">
                <h2>135 CC</h2>
                <p>Entry Spec Development</p>
            </a>
            <a href="150cc.html" class="class-card">
                <h2>150 CC</h2>
                <p>Mid-Tier Prototype</p>
            </a>
            <a href="600cc.html" class="class-card">
                <h2>600 CC</h2>
                <p>High Output Performance</p>
            </a>
            <a href="ev.html" class="class-card">
                <h2>EV</h2>
                <p>Electric Powertrain Spec</p>
            </a>
        </div>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // AUTHENTICATION LOGIC
        const authLink = document.getElementById("authLink");
        const isLoggedIn = localStorage.getItem("vcrt_is_logged_in") === "true";

        if (authLink) {
            if (isLoggedIn) {
                authLink.innerText = "Sign Out";
                authLink.style.color = "#ff3b30";
                authLink.style.opacity = "1";
                authLink.href = "#";
                authLink.addEventListener("click", function (e) {
                    e.preventDefault();
                    localStorage.removeItem("vcrt_is_logged_in");
                    localStorage.removeItem("vcrt_user");
                    window.location.reload();
                });
            } else {
                authLink.innerText = "Sign In";
                authLink.style.color = "var(--neon-blue)";
                authLink.style.opacity = "1";
                authLink.href = "signin.html";
            }
        }

        // TELEMETRY GRAPH INITIALIZATION
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [
                    {
                        label: '135 CC Spending',
                        data: [1200, 1900, 800, 1500, 2000, 2400],
                        borderColor: '#00f3ff',
                        backgroundColor: 'rgba(0, 243, 255, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: '600 CC Spending',
                        data: [2500, 3100, 4000, 2800, 4200, 5100],
                        borderColor: '#ff3366',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.4
                    },
                    {
                        label: 'EV Division Spending',
                        data: [1800, 2200, 3500, 3100, 2900, 4500],
                        borderColor: '#00ff66',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#ccc',
                            font: { family: 'Inter', size: 12 }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#1a1a1a' },
                        ticks: { color: '#888' }
                    },
                    y: {
                        grid: { color: '#1a1a1a' },
                        ticks: { color: '#888' }
                    }
                }
            }
        });
    });
</script>

</body>
</html>
