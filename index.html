<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCRT Dashboard - Overview</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent-blue: #00f3ff;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #232a3b;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .dash-menu {
      display: flex;
      gap: 1.5rem;
    }
    .dash-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .dash-menu a:hover, .dash-menu a.active {
      color: var(--accent-blue);
    }
    .btn-signout {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 10px;
    }
    .card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .card .value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-blue);
    }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header class="header">
    <h2>VCRT Overview</h2>
    <nav class="dash-menu">
      <a href="index.html" class="active">Home</a>
      <a href="transactions.html">Transactions</a>
      <a href="135cc.html">135CC</a>
      <a href="150cc.html">150CC</a>
      <a href="600cc.html">600CC</a>
      <a href="ev.html">EV Class</a>
    </nav>
    <button id="signOutBtn" class="btn-signout">Sign Out</button>
  </header>

  <main class="container">
    <div class="cards-grid">
      <div class="card">
        <h3>Total Income</h3>
        <div class="value" id="totalIncome">$0.00</div>
      </div>
      <div class="card">
        <h3>Total Expenses</h3>
        <div class="value" id="totalExpenses">$0.00</div>
      </div>
      <div class="card">
        <h3>Net Balance</h3>
        <div class="value" id="netBalance">$0.00</div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Class Expense Distribution</h3>
      <canvas id="overviewChart"></canvas>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "vcrt-dashboard",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Standardized Sign-Out Redirect
    document.getElementById('signOutBtn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'signin.html';
      }).catch((error) => {
        console.error("Sign-out error:", error);
      });
    });

    // Real-Time Overview Aggregation
    let overviewChart;
    db.collection('transactions').onSnapshot((snapshot) => {
      let income = 0;
      let expenses = 0;
      const classTotals = { '135CC': 0, '150CC': 0, '600CC': 0, 'EV': 0 };

      snapshot.forEach((doc) => {
        const data = doc.data();
        const amount = parseFloat(data.amount) || 0;
        if (data.type === 'income') {
          income += amount;
        } else if (data.type === 'expense') {
          expenses += amount;
          if (classTotals.hasOwnProperty(data.class)) {
            classTotals[data.class] += amount;
          }
        }
      });

      document.getElementById('totalIncome').innerText = `$${income.toFixed(2)}`;
      document.getElementById('totalExpenses').innerText = `$${expenses.toFixed(2)}`;
      document.getElementById('netBalance').innerText = `$${(income - expenses).toFixed(2)}`;

      renderChart(classTotals);
    });

    function renderChart(totals) {
      const ctx = document.getElementById('overviewChart').getContext('2d');
      if (overviewChart) {
        overviewChart.destroy();
      }
      overviewChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['135CC', '150CC', '600CC', 'EV'],
          datasets: [{
            label: 'Expenses ($)',
            data: [totals['135CC'], totals['150CC'], totals['600CC'], totals['EV']],
            backgroundColor: ['#bf5af2', '#00f3ff', '#ff9500', '#00ffaa']
          }]
        },
        options: { responsive: true }
      });
    }
  </script>
</body>
</html>
