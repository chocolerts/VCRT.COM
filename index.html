<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Core Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-blue: #00f3ff; 
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        /* NAVIGATION CSS */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .dash-link:hover, .active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* MAIN CONTENT */
        .main-content {
            padding: 60px 10%;
            text-align: center;
        }

        .core-header {
            margin-bottom: 30px;
        }

        .core-header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
        }

        /* FINANCIAL SUMMARY GRID */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 50px auto;
        }

        .summary-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
        }

        .summary-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .summary-card h3 {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }

        .summary-card .amount {
            font-size: 2rem;
            font-weight: 900;
            margin: 0;
        }

        /* CHART & CLASS GRID */
        .chart-container {
            background: #111;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 30px;
            margin: 0 auto 50px auto;
            max-width: 900px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: 0.4s;
        }
        
        .chart-container:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .class-card {
            background: #111;
            border: 1px solid #222;
            padding: 40px 20px;
            border-radius: 15px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .class-card:hover {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-outline);
            transform: translateY(-10px);
        }

        .class-card h2 {
            font-size: 3rem;
            font-weight: 900;
            margin: 10px 0;
            color: #fff;
        }

        .class-card p {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .btn-select {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .btn-select:hover {
            background: var(--neon-blue);
            color: #000;
        }

        .class-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--neon-blue);
            opacity: 0;
            transition: 0.3s;
        }

        .class-card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link active">Dashboard</a>
            <a href="transaction.html" class="dash-link">Transactions</a>
            <a href="signin.html" class="dash-link">Sign In</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="core-header">
            <h1>VCRT <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">CORE</span></h1>
            <p style="color: #444; letter-spacing: 5px; font-size: 0.8rem;">VEHICLE CLASS SELECTION</p>
        </div>

        <!-- NEW 3 FINANCIAL BOXES -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3>Total Income</h3>
                <p class="amount" id="totalIncome" style="color: #00ffaa;">$0</p>
            </div>
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p class="amount" id="totalExpenses" style="color: #ff3b30;">$0</p>
            </div>
            <div class="summary-card">
                <h3>Net Balance</h3>
                <p class="amount" id="totalBalance" style="color: var(--neon-blue);">$0</p>
            </div>
        </div>

        <div id="metrics-dashboard" class="chart-container">
            <h3 style="color: #fff; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; text-align: left;">
                <span style="color: var(--neon-blue)">//</span> Live Transaction Funds ($)
            </h3>
            <div style="position: relative; height:300px; width:100%">
                <canvas id="vcrtAnalyticsChart"></canvas>
            </div>
        </div>

        <div class="class-grid">
            <div class="class-card">
                <p>FSAE</p>
                <h2>150CC</h2>
                <button class="btn-select">Enter Class</button>
            </div>

            <div class="class-card">
                <p>FSM</p>
                <h2>600CC</h2>
                <button class="btn-select">Enter Class</button>
            </div>

            <div class="class-card">
                <p>Future Tech</p>
                <h2>EV</h2>
                <button class="btn-select">Enter Class</button>
            </div>
        </div>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const transactions = JSON.parse(localStorage.getItem('vcrt_transactions')) || [];
        
        // FINANCIAL CALCULATIONS
        let incomeSum = 0;
        let expenseSum = 0;

        const totals = {
            '150CC': 0,
            '600CC': 0,
            'EV': 0
        };

        transactions.forEach(tx => {
            if (tx.type === 'income') {
                incomeSum += tx.amount;
            } else if (tx.type === 'expense') {
                expenseSum += tx.amount;
            }

            if (totals.hasOwnProperty(tx.vClass)) {
                if (tx.type === 'income') {
                    totals[tx.vClass] += tx.amount;
                } else if (tx.type === 'expense') {
                    totals[tx.vClass] -= tx.amount;
                }
            }
        });

        const netBalance = incomeSum - expenseSum;

        // DISPLAY SUMMARY DATA
        document.getElementById('totalIncome').innerText = `$${incomeSum.toLocaleString()}`;
        document.getElementById('totalExpenses').innerText = `$${expenseSum.toLocaleString()}`;
        
        const balanceEl = document.getElementById('totalBalance');
        balanceEl.innerText = `$${netBalance.toLocaleString()}`;
        if (netBalance < 0) {
            balanceEl.style.color = '#ff3b30'; // Red if negative balance
        }

        // INITIALIZE CHART.JS CHART
        const ctx = document.getElementById('vcrtAnalyticsChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['150CC (FSAE)', '600CC (FSM)', 'EV (FUTURE TECH)'],
                datasets: [{
                    label: 'Total Net Funding ($)',
                    data: [totals['150CC'], totals['600CC'], totals['EV']],
                    backgroundColor: 'rgba(0, 243, 255, 0.2)',
                    borderColor: '#00f3ff',
                    borderWidth: 2,
                    borderRadius: 5,
                    hoverBackgroundColor: 'rgba(0, 243, 255, 0.5)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#666',
                            font: { family: 'Inter', size: 10 }
                        }
                    }
                },
                scales: {
                    y: {
                        grid: { color: '#222' },
                        ticks: { color: '#666', font: { family: 'Inter' } },
                        beginAtZero: true
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#fff', font: { family: 'Inter', weight: 'bold' } }
                    }
                }
            }
        });
    });
</script>

</body>
</html>
