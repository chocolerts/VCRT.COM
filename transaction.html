<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack 2.0 | Transaction Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- FIREBASE CLOUD SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.4rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        .auth-container-right {
            display: flex;
            align-items: center;
            min-width: 80px;
            justify-content: flex-end;
        }

        .lock-banner {
            display: none;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid #ff3b30;
            color: #ff3b30;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .lock-banner a {
            color: var(--neon-blue);
            text-decoration: underline;
        }

        .main-container {
            max-width: 650px;
            margin: 40px auto;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h2 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .radio-options-container {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .radio-card-label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111;
            border: 1px solid #333;
            padding: 11px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            color: #aaa;
            transition: 0.3s;
            user-select: none;
        }

        .radio-card-label input[type="radio"] {
            display: none;
        }

        .radio-circle {
            width: 14px;
            height: 14px;
            border: 2px solid #555;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .radio-card-label:hover {
            border-color: var(--neon-blue);
            color: #fff;
        }

        .radio-card-label:has(input[type="radio"]:checked) {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.08);
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .radio-card-label input[type="radio"]:checked + .radio-circle {
            border-color: var(--neon-blue);
        }

        .radio-card-label input[type="radio"]:checked + .radio-circle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 6px;
            height: 6px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-blue);
        }

        fieldset:disabled .radio-card-label {
            background: #080808;
            border-color: #1a1a1a;
            color: #444;
            cursor: not-allowed;
        }

        input:disabled, select:disabled, textarea:disabled {
            background: #080808;
            border-color: #1a1a1a;
            color: #444;
            cursor: not-allowed;
        }

        .btn-submit:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: var(--neon-outline);
            transform: translateY(-2px);
        }

        .btn-cancel-edit {
            width: 100%;
            background: transparent;
            color: #888;
            border: 1px solid #444;
            padding: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            transition: 0.3s;
        }

        .btn-cancel-edit:hover {
            border-color: #888;
            color: #fff;
        }

        .logs-container {
            max-width: 1000px;
            margin: 40px auto 60px auto;
        }

        .logs-title {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.85rem;
            border-bottom: 1px solid #1a1a1a;
        }

        th {
            background: #111;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .income-text { color: #00ffaa; font-weight: bold; }
        .expense-text { color: #ff3b30; font-weight: bold; }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .btn-edit:hover:not(:disabled) {
            background: var(--neon-blue);
            color: #000;
        }

        .btn-edit:disabled {
            border-color: #333;
            color: #444;
            cursor: not-allowed;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #ff3b30;
            color: #ff3b30;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .btn-delete:hover:not(:disabled) {
            background: #ff3b30;
            color: #fff;
        }

        .btn-delete:disabled {
            border-color: #333;
            color: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">FinTrack 2.0</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Home</a>
            <a href="transaction.html" class="dash-link active">Transactions</a>
            <a href="aboutus.html" class="dash-link">About Us</a>
            <a href="achievement.html" class="dash-link">Achievements</a>
        </nav>

        <div class="auth-container-right">
            <a href="#" class="dash-link" id="authLink" style="display: none;">Sign Out</a>
        </div>
    </header>

    <main class="main-container">
        <div class="lock-banner" id="lockBanner">
            🔒 Read-Only Mode. Please <a href="signin.html">Sign In</a> to log or edit transactions.
        </div>

        <div class="form-title">
            <h2 id="formHeaderTitle">LOG <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">TRANSACTION</span></h2>
        </div>

        <fieldset id="formFieldset" style="border: none; padding: 0; margin: 0;">
            <form id="transactionForm">
                <input type="hidden" id="editingDocId" value="">

                <div class="form-row">
                    <div class="form-group">
                        <label for="txDate">Transaction Date</label>
                        <input type="date" id="txDate" required>
                    </div>

                    <div class="form-group">
                        <label>Transaction Type</label>
                        <div class="radio-options-container">
                            <label class="radio-card-label">
                                <input type="radio" name="transType" value="expense" checked>
                                <span class="radio-circle"></span>
                                <span style="color: #ff3b30;">Expense (-)</span>
                            </label>
                            <label class="radio-card-label">
                                <input type="radio" name="transType" value="income">
                                <span class="radio-circle"></span>
                                <span style="color: #00ffaa;">Income (+)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="vClass">Vehicle Class</label>
                        <select id="vClass" required>
                            <option value="150CC">150CC Class</option>
                            <option value="600CC">600CC Class</option>
                            <option value="EV">EV Class</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="variant">Component Variant</label>
                        <select id="variant" required>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="refNum">Reference Number</label>
                        <input type="text" id="refNum" placeholder="e.g. REF-89021" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (RM)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description / Item Details</label>
                    <textarea id="description" rows="3" placeholder="Enter transaction notes or part descriptions..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Submit Transaction</button>
                <button type="button" class="btn-cancel-edit" id="cancelEditBtn">Cancel Edit</button>
            </form>
        </fieldset>
    </main>

    <div class="logs-container">
        <div class="logs-title">// Recent Transactions</div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Ref #</th>
                    <th>Class</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transactionLogBody">
            </tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnZQPxnxw2gGcAFRTGfx62kzHG5aM_G7g",
        authDomain: "vcrt-dashboard.firebaseapp.com",
        projectId: "vcrt-dashboard",
        storageBucket: "vcrt-dashboard.firebasestorage.app",
        messagingSenderId: "1017093341978",
        appId: "1:1017093341978:web:ef666bd6309f21c869e2a3",
        measurementId: "G-VV6873XWF3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const expenseVariants = [
        "Brake System",
        "Engine & Drivetrain",
        "Suspension & Shocks",
        "Frame & Body",
        "Instruments & Wiring",
        "Wheels & Tires",
        "Steering System",
        "Miscellaneous, Fit & Finish"
    ];

    const incomeVariants = [
        "PIBG",
        "Other Contribution"
    ];

    const loadedTransactionsMap = {};

    document.addEventListener("DOMContentLoaded", function () {
        const authLink = document.getElementById("authLink");
        const isLoggedIn = localStorage.getItem("vcrt_is_logged_in") === "true";
        const lockBanner = document.getElementById("lockBanner");
        const formFieldset = document.getElementById("formFieldset");
        const variantSelect = document.getElementById("variant");
        const transTypeRadios = document.querySelectorAll('input[name="transType"]');
        const submitBtn = document.getElementById("submitBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");
        const editingDocIdInput = document.getElementById("editingDocId");
        const formHeaderTitle = document.getElementById("formHeaderTitle");
        const form = document.getElementById("transactionForm");
        const logBody = document.getElementById("transactionLogBody");
        const dateInput = document.getElementById("txDate");

        if (authLink) {
            if (isLoggedIn) {
                authLink.style.display = "inline-block";
                authLink.innerText = "Sign Out";
                authLink.style.color = "#ff3b30";
                authLink.style.opacity = "1";
                authLink.href = "#";
                authLink.addEventListener("click", function (e) {
                    e.preventDefault();
                    localStorage.removeItem("vcrt_is_logged_in");
                    localStorage.removeItem("vcrt_user");
                    window.location.href = "signin.html";
                });
                lockBanner.style.display = "none";
                formFieldset.disabled = false;
            } else {
                authLink.style.display = "none";
                lockBanner.style.display = "block";
                formFieldset.disabled = true;
            }
        }

        dateInput.valueAsDate = new Date();

        function updateVariantOptions(selectedType, targetValue = null) {
            variantSelect.innerHTML = "";
            const list = selectedType === "income" ? incomeVariants : expenseVariants;

            list.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item;
                opt.textContent = item;
                variantSelect.appendChild(opt);
            });

            if (targetValue && list.includes(targetValue)) {
                variantSelect.value = targetValue;
            }
        }

        updateVariantOptions("expense");

        transTypeRadios.forEach(radio => {
            radio.addEventListener("change", function () {
                updateVariantOptions(this.value);
            });
        });

        function resetFormState() {
            form.reset();
            editingDocIdInput.value = "";
            dateInput.valueAsDate = new Date();
            document.querySelector('input[name="transType"][value="expense"]').checked = true;
            updateVariantOptions("expense");
            submitBtn.innerText = "Submit Transaction";
            cancelEditBtn.style.display = "none";
            formHeaderTitle.innerHTML = `LOG <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">TRANSACTION</span>`;
        }

        cancelEditBtn.addEventListener("click", resetFormState);

        function listenToCloudTransactions() {
            db.collection("transactions").orderBy("createdAt", "desc")
              .onSnapshot((snapshot) => {
                logBody.innerHTML = "";

                if (snapshot.empty) {
                    logBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#555;">No transactions logged yet.</td></tr>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const tx = doc.data();
                    const docId = doc.id;
                    loadedTransactionsMap[docId] = tx;

                    const row = document.createElement("tr");

                    let displayVariant = tx.variant;
                    if (displayVariant === "Fit & Finish" || displayVariant === "Miscellaneous") {
                        displayVariant = "Miscellaneous, Fit & Finish";
                    }

                    const amountFormatted = tx.type === 'income' 
                        ? `<span class="income-text">+RM${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>` 
                        : `<span class="expense-text">-RM${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>`;

                    const btnState = isLoggedIn ? "" : "disabled";
                    const refDisplay = tx.refNum ? tx.refNum : "N/A";

                    row.innerHTML = `
                        <td style="color:#888;">${tx.date}</td>
                        <td style="color:var(--neon-blue); font-weight:bold;">${refDisplay}</td>
                        <td><strong>${tx.vClass}</strong></td>
                        <td style="text-transform:uppercase; font-size:0.75rem;">${tx.type}</td>
                        <td>${displayVariant}</td>
                        <td>${tx.description}</td>
                        <td>${amountFormatted}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" ${btnState} onclick="startEditTransaction('${docId}')">Edit</button>
                                <button class="btn-delete" ${btnState} onclick="deleteCloudTransaction('${docId}')">Remove</button>
                            </div>
                        </td>
                    `;

                    logBody.appendChild(row);
                });
            });
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            if (!isLoggedIn) return;

            const inputDateVal = dateInput.value;
            let formattedDate = inputDateVal;
            if (inputDateVal) {
                const parts = inputDateVal.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                formattedDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            const selectedType = document.querySelector('input[name="transType"]:checked').value;
            const editingId = editingDocIdInput.value;

            const txData = {
                type: selectedType,
                vClass: document.getElementById("vClass").value,
                variant: document.getElementById("variant").value,
                refNum: document.getElementById("refNum").value,
                amount: parseFloat(document.getElementById("amount").value),
                description: document.getElementById("description").value,
                date: formattedDate
            };

            if (editingId) {
                db.collection("transactions").doc(editingId).update(txData).then(() => {
                    resetFormState();
                }).catch((err) => alert("Cloud Error: " + err.message));
            } else {
                txData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection("transactions").add(txData).then(() => {
                    resetFormState();
                }).catch((err) => alert("Cloud Error: " + err.message));
            }
        });

        window.startEditTransaction = function (docId) {
            if (!isLoggedIn) return;
            const tx = loadedTransactionsMap[docId];
            if (!tx) return;

            editingDocIdInput.value = docId;

            const typeRadio = document.querySelector(`input[name="transType"][value="${tx.type}"]`);
            if (typeRadio) typeRadio.checked = true;

            updateVariantOptions(tx.type, tx.variant);

            document.getElementById("vClass").value = tx.vClass || "150CC";
            document.getElementById("refNum").value = tx.refNum || "";
            document.getElementById("amount").value = tx.amount || "";
            document.getElementById("description").value = tx.description || "";

            if (tx.date) {
                const parsedDate = new Date(tx.date);
                if (!isNaN(parsedDate.getTime())) {
                    dateInput.value = parsedDate.toISOString().split('T')[0];
                }
            }

            submitBtn.innerText = "Update Transaction";
            cancelEditBtn.style.display = "block";
            formHeaderTitle.innerHTML = `EDIT <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">TRANSACTION</span>`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteCloudTransaction = function (docId) {
            if (!isLoggedIn) return;

            const firstConfirm = confirm("Are you sure you want to delete this transaction?");
            if (firstConfirm) {
                const secondConfirm = confirm("DOUBLE VERIFICATION: This action cannot be undone. Confirm deletion?");
                if (secondConfirm) {
                    db.collection("transactions").doc(docId).delete().then(() => {
                        if (editingDocIdInput.value === docId) {
                            resetFormState();
                        }
                    }).catch(err => alert("Error deleting transaction: " + err.message));
                }
            }
        };

        listenToCloudTransactions();
    });
</script>

</body>
</html>
