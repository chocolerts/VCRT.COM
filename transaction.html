<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Transaction Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        /* NAVIGATION BAR */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* FORM CONTAINER */
        .main-container {
            max-width: 650px;
            margin: 40px auto;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h2 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: var(--neon-outline);
            transform: translateY(-2px);
        }

        /* RECENT LOG TABLE */
        .logs-container {
            max-width: 900px;
            margin: 40px auto 60px auto;
        }

        .logs-title {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.85rem;
            border-bottom: 1px solid #1a1a1a;
        }

        th {
            background: #111;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .income-text { color: #00ffaa; font-weight: bold; }
        .expense-text { color: #ff3b30; font-weight: bold; }

        .btn-delete {
            background: transparent;
            border: 1px solid #ff3b30;
            color: #ff3b30;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #ff3b30;
            color: #fff;
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Dashboard</a>
            <a href="transaction.html" class="dash-link active">Transactions</a>
            <a href="signin.html" class="dash-link">Sign In</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="form-title">
            <h2>LOG <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">TRANSACTION</span></h2>
        </div>

        <form id="transactionForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="transType">Transaction Type</label>
                    <select id="transType" required>
                        <option value="expense">Expense (-)</option>
                        <option value="income">Income (+)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vClass">Vehicle Class</label>
                    <select id="vClass" required>
                        <option value="150CC">150CC Class</option>
                        <option value="600CC">600CC Class</option>
                        <option value="EV">EV Class</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="variant">Component Variant</label>
                    <select id="variant" required>
                        <option value="Brake System">Brake System</option>
                        <option value="Engine & Drivetrain">Engine & Drivetrain</option>
                        <option value="Suspension & Shocks">Suspension & Shocks</option>
                        <option value="Frame & Body">Frame & Body</option>
                        <option value="Instruments & Wiring">Instruments & Wiring</option>
                        <option value="Wheels & Tires">Wheels & Tires</option>
                        <option value="Steering System">Steering System</option>
                        <option value="Miscellaneous, Fit & Finish">Miscellaneous, Fit & Finish</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description / Item Details</label>
                <textarea id="description" rows="3" placeholder="Enter transaction notes or part descriptions..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Transaction</button>
        </form>
    </main>

    <div class="logs-container">
        <div class="logs-title">// Recent Transactions</div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Class</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transactionLogBody">
                <!-- Dynamic Log Content -->
            </tbody>
        </table>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("transactionForm");
        const logBody = document.getElementById("transactionLogBody");

        // LOAD AND DISPLAY TRANSACTIONS
        function loadTransactions() {
            const transactions = JSON.parse(localStorage.getItem('vcrt_transactions')) || [];
            logBody.innerHTML = "";

            if (transactions.length === 0) {
                logBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#555;">No transactions logged yet.</td></tr>`;
                return;
            }

            transactions.forEach((tx, index) => {
                const row = document.createElement("tr");

                // Merge legacy entries into unified category for UI rendering
                let displayVariant = tx.variant;
                if (displayVariant === "Fit & Finish" || displayVariant === "Miscellaneous") {
                    displayVariant = "Miscellaneous, Fit & Finish";
                }

                const amountFormatted = tx.type === 'income' 
                    ? `<span class="income-text">+$${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>` 
                    : `<span class="expense-text">-$${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>`;

                row.innerHTML = `
                    <td style="color:#888;">${tx.date}</td>
                    <td><strong>${tx.vClass}</strong></td>
                    <td style="text-transform:uppercase; font-size:0.75rem;">${tx.type}</td>
                    <td>${displayVariant}</td>
                    <td>${tx.description}</td>
                    <td>${amountFormatted}</td>
                    <td><button class="btn-delete" onclick="deleteTransaction(${index})">Remove</button></td>
                `;

                logBody.appendChild(row);
            });
        }

        // SAVE NEW TRANSACTION
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const newTx = {
                type: document.getElementById("transType").value,
                vClass: document.getElementById("vClass").value,
                variant: document.getElementById("variant").value,
                amount: parseFloat(document.getElementById("amount").value),
                description: document.getElementById("description").value,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            };

            const transactions = JSON.parse(localStorage.getItem('vcrt_transactions')) || [];
            transactions.unshift(newTx);
            localStorage.setItem('vcrt_transactions', JSON.stringify(transactions));

            form.reset();
            loadTransactions();
        });

        // DELETE TRANSACTION
        window.deleteTransaction = function (index) {
            const transactions = JSON.parse(localStorage.getItem('vcrt_transactions')) || [];
            transactions.splice(index, 1);
            localStorage.setItem('vcrt_transactions', JSON.stringify(transactions));
            loadTransactions();
        };

        loadTransactions();
    });
</script>

</body>
</html>
