<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | Transaction Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* NAVIGATION CSS */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .dash-link:hover, .active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* MAIN CONTENT */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .ledger-container {
            background: #0a0a0a;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #222;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            transition: 0.4s;
        }

        .ledger-container:hover {
            border-color: var(--neon-blue);
            box-shadow: var(--neon-outline);
        }

        .brand-title {
            font-weight: 900;
            letter-spacing: 6px;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: var(--neon-outline);
        }

        h2 {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            border-color: var(--neon-blue);
            background: #151515;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #444;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-align: center;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--neon-blue);
        }

        .btn-logout {
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('ACCESS DENIED. Sila Sign In terlebih dahulu!');
            window.location.href = 'signin.html';
        }
    </script>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Dashboard</a>
            <a href="transaction.html" class="dash-link active">Transactions</a>
            <a href="signin.html" class="dash-link">Sign In</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="ledger-container">
            <div class="brand-title">VCRT</div>
            <h2>LOG TRANSACTION // CORE_FINANCE</h2>
            
            <form id="transactionForm">
                <div class="input-group">
                    <label>Vehicle Class Target</label>
                    <select id="vehicleClass" required>
                        <option value="150CC">150CC (FSAE)</option>
                        <option value="600CC">600CC (FSM)</option>
                        <option value="EV">EV (FUTURE TECH)</option>
                    </select>
                </div>

                <!-- 9 VARIANT CATEGORIES -->
                <div class="input-group">
                    <label>System Component Variant</label>
                    <select id="variantType" required>
                        <option value="Brake System">Brake System</option>
                        <option value="Engine & Drivetrain">Engine & Drivetrain</option>
                        <option value="Suspension & Shocks">Suspension & Shocks</option>
                        <option value="Frame & Body">Frame & Body</option>
                        <option value="Instruments & Wiring">Instruments & Wiring</option>
                        <option value="Wheels & Tires">Wheels & Tires</option>
                        <option value="Fit & Finish">Fit & Finish</option>
                        <option value="Steering System">Steering System</option>
                        <option value="Miscellaneous">Miscellaneous</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Allocation Type</label>
                    <select id="txType" required>
                        <option value="income">System Funding (+)</option>
                        <option value="expense">R&D / Material Cost (-)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Credits / Amount ($)</label>
                    <input type="number" id="txAmount" placeholder="e.g., 500" min="1" required>
                </div>

                <button type="submit" class="btn-submit">Execute Ledger Entry</button>
            </form>

            <a href="index.html" class="back-link">← RETURN TO DASHBOARD SYSTEM</a>
            <button class="btn-logout" onclick="logout()">[ SIGN OUT ]</button>
        </div>
    </div>

    <script>
        const getTransactions = () => JSON.parse(localStorage.getItem('vcrt_transactions')) || [];

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const vClass = document.getElementById('vehicleClass').value;
            const variant = document.getElementById('variantType').value;
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);

            const newTx = { vClass, variant, type, amount, timestamp: Date.now() };
            const currentTxs = getTransactions();
            currentTxs.push(newTx);

            localStorage.setItem('vcrt_transactions', JSON.stringify(currentTxs));
            
            alert(`LEDGER UPDATE: $${amount} allocated to ${vClass} [${variant}]`);
            document.getElementById('transactionForm').reset();
        });

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'signin.html';
        }
    </script>

</body>
</html>
