<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | 150CC Class Breakdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- FIREBASE CLOUD SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        /* NAVIGATION BAR */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        /* PAGE CONTENT */
        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
        }

        .header-title p {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* COMPONENT GRID */
        .variant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .variant-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }

        .variant-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .variant-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .variant-card .total {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-blue);
            margin: 0;
        }

        /* RECENT LOG TABLE */
        .logs-container {
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid #222;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .logs-title {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 0.85rem;
            border-bottom: 1px solid #1a1a1a;
        }

        th {
            background: #111;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .income-text { color: #00ffaa; font-weight: bold; }
        .expense-text { color: #ff3b30; font-weight: bold; }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="brand-container">
            <a href="index.html" class="brand-name">VCRT</a>
        </div>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Dashboard</a>
            <a href="transaction.html" class="dash-link">Transactions</a>
            <a href="signin.html" class="dash-link" id="authLink">Sign In</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="header-title">
            <h1>150CC <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">CLASS</span></h1>
            <p>// Component Financial Breakdown</p>
        </div>

        <!-- COMPONENT VARIANT BREAKDOWN CARDS -->
        <div class="variant-grid" id="variantCardsContainer">
            <!-- Dynamic Variant Cards -->
        </div>

        <!-- CLASS TRANSACTIONS TABLE -->
        <div class="logs-container">
            <div class="logs-title">// 150CC Class Recorded Transactions</div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Component Variant</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="classLogBody">
                    <!-- Dynamic Log Content -->
                </tbody>
            </table>
        </div>
    </main>

<script>
    // YOUR INTEGRATED FIREBASE CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyBnZQPxnxw2gGcAFRTGfx62kzHG5aM_G7g",
        authDomain: "vcrt-dashboard.firebaseapp.com",
        projectId: "vcrt-dashboard",
        storageBucket: "vcrt-dashboard.firebasestorage.app",
        messagingSenderId: "1017093341978",
        appId: "1:1017093341978:web:ef666bd6309f21c869e2a3",
        measurementId: "G-VV6873XWF3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener("DOMContentLoaded", function () {
        const authLink = document.getElementById("authLink");
        const isLoggedIn = localStorage.getItem("vcrt_is_logged_in") === "true";

        if (isLoggedIn && authLink) {
            authLink.innerText = "Sign Out";
            authLink.href = "#";
            authLink.style.color = "#ff3b30";
            authLink.addEventListener("click", function (e) {
                e.preventDefault();
                localStorage.removeItem("vcrt_is_logged_in");
                localStorage.removeItem("vcrt_user");
                window.location.reload();
            });
        }

        const classLogBody = document.getElementById("classLogBody");
        const variantCardsContainer = document.getElementById("variantCardsContainer");

        const variants = [
            "Brake System", 
            "Engine & Drivetrain", 
            "Suspension & Shocks", 
            "Frame & Body", 
            "Instruments & Wiring", 
            "Wheels & Tires", 
            "Steering System", 
            "Miscellaneous, Fit & Finish"
        ];

        // LISTEN TO FIRESTORE CLOUD DATA FOR 150CC CLASS
        db.collection("transactions")
          .where("vClass", "==", "150CC")
          .onSnapshot((snapshot) => {
            classLogBody.innerHTML = "";
            
            const variantTotals = {};
            variants.forEach(v => variantTotals[v] = 0);

            if (snapshot.empty) {
                classLogBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#555;">No transactions recorded for 150CC class yet.</td></tr>`;
            } else {
                snapshot.forEach((doc) => {
                    const tx = doc.data();
                    const row = document.createElement("tr");

                    let displayVariant = tx.variant;
                    if (displayVariant === "Fit & Finish" || displayVariant === "Miscellaneous") {
                        displayVariant = "Miscellaneous, Fit & Finish";
                    }

                    if (tx.type === 'expense' && variantTotals.hasOwnProperty(displayVariant)) {
                        variantTotals[displayVariant] += tx.amount;
                    }

                    const amountFormatted = tx.type === 'income' 
                        ? `<span class="income-text">+$${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>` 
                        : `<span class="expense-text">-$${tx.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>`;

                    row.innerHTML = `
                        <td style="color:#888;">${tx.date}</td>
                        <td style="text-transform:uppercase; font-size:0.75rem;">${tx.type}</td>
                        <td>${displayVariant}</td>
                        <td>${tx.description}</td>
                        <td>${amountFormatted}</td>
                    `;

                    classLogBody.appendChild(row);
                });
            }

            // RENDER VARIANT BREAKDOWN CARDS
            variantCardsContainer.innerHTML = "";
            variants.forEach(variant => {
                const card = document.createElement("div");
                card.className = "variant-card";
                card.innerHTML = `
                    <h3>${variant}</h3>
                    <p class="total">$${variantTotals[variant].toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                `;
                variantCardsContainer.appendChild(card);
            });
        });
    });
</script>

</body>
</html>
