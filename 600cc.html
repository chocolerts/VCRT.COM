<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCRT | 600 CC Division</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050505;
            --nav-height: 80px;
            --neon-outline: 0 0 10px var(--neon-blue);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            padding-top: var(--nav-height);
        }

        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--dark-bg);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 2px 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-sizing: border-box;
        }

        .brand-name {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.6rem;
            color: #ffffff;
            text-shadow: var(--neon-outline);
            text-decoration: none;
        }

        .dash-menu {
            display: flex;
            align-items: center;
            gap: 30px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .dash-link {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .dash-link:hover, .dash-link.active {
            opacity: 1;
            color: var(--neon-blue);
            text-shadow: var(--neon-outline);
        }

        .auth-container-right {
            display: flex;
            align-items: center;
            min-width: 80px;
            justify-content: flex-end;
        }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
        }

        .page-title p {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .spec-box {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <a href="index.html" class="brand-name">VCRT</a>

        <nav class="dash-menu">
            <a href="index.html" class="dash-link">Home</a>
            <a href="transaction.html" class="dash-link">Transactions</a>
            <a href="aboutus.html" class="dash-link">About Us</a>
        </nav>

        <div class="auth-container-right">
            <a href="signin.html" class="dash-link" id="authLink">Sign In</a>
        </div>
    </header>

    <main class="main-container">
        <div class="page-title">
            <h1>600 CC <span style="color: var(--neon-blue); text-shadow: var(--neon-outline);">SPECIFICATIONS</span></h1>
            <p>// High Output Performance Class</p>
        </div>

        <div class="spec-box">
            <p style="color: #ccc; line-height: 1.6;">
                Detailed telemetry, component ledgers, and build progress logs for the 600 CC class are actively updated here.
            </p>
        </div>
    </main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const authLink = document.getElementById("authLink");
        const isLoggedIn = localStorage.getItem("vcrt_is_logged_in") === "true";

        if (authLink) {
            if (isLoggedIn) {
                authLink.innerText = "Sign Out";
                authLink.style.color = "#ff3b30";
                authLink.style.opacity = "1";
                authLink.href = "#";
                authLink.addEventListener("click", function (e) {
                    e.preventDefault();
                    localStorage.removeItem("vcrt_is_logged_in");
                    localStorage.removeItem("vcrt_user");
                    window.location.reload();
                });
            } else {
                authLink.innerText = "Sign In";
                authLink.style.color = "var(--neon-blue)";
                authLink.style.opacity = "1";
                authLink.href = "signin.html";
            }
        }
    });
</script>

</body>
</html>
